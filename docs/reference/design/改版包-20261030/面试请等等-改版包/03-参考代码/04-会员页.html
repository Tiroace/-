<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>会员</title>
<meta name="viewport" content="width=390">
<link rel="stylesheet" href="theme.css">
</head>
<body>
<div class="page" style="width: 390px; height: 1010px">
  <header class="nav">
    <a href="03-次数用完弹窗.html" aria-label="返回"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></a>
    <span>会员</span>
  </header>
  <main class="main" style="padding-top: 16px; padding-bottom: 24px">
    <h1 class="big-title">找工作这段时间，<br>每份邀约都先查一下</h1>

    <section class="anchor">
      <div class="logo lg" aria-hidden="true"><i></i><i></i></div>
      <p>少交一次 300 元的押金，<br>会员费就回来了。</p>
    </section>

    <div class="card list" style="margin-top: 20px">
      <div class="perk">
        <span class="icon-box" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg></span>
        <span class="grow"><span class="t">每天最多查 20 次</span><span class="s">免费用户：送 3 次，看广告再换</span></span>
      </div>
      <div class="perk">
        <span class="icon-box" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/></svg></span>
        <span class="grow"><span class="t">检查记录保存 30 天</span><span class="s">免费用户保存 7 天</span></span>
      </div>
      <div class="perk">
        <span class="icon-box" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0114-5.3L20 9"/><path d="M20 4v5h-5"/><path d="M20 12a8 8 0 01-14 5.3L4 15"/><path d="M4 20v-5h5"/></svg></span>
        <span class="grow"><span class="t">同一份工作反复查</span><span class="s">HR 发来新消息，截图再查一次</span></span>
      </div>
    </div>

    <h2 class="h2" style="margin-top: 24px">选个时长</h2>
    <div class="plans" role="radiogroup" aria-label="会员时长">
      <label class="plan"><input type="radio" name="plan"><span class="grow"><span class="name">周卡</span><span class="s">这周就要面试，选这个</span></span><span class="price">¥6.9</span></label>
      <label class="plan on"><input type="radio" name="plan" checked><span class="grow"><span style="display: flex; align-items: center; gap: 8px"><span class="name">月卡</span><span class="badge">推荐</span></span><span class="s">约 ¥0.66 一天</span></span><span class="price">¥19.9</span></label>
      <label class="plan"><input type="radio" name="plan"><span class="grow"><span class="name">季卡</span><span class="s">约 ¥0.44 一天，找工作时间长更划算</span></span><span class="price">¥39.9</span></label>
    </div>
    <p class="meta">一次性购买，到期不自动续费。</p>
  </main>
  <div class="paybar">
    <button class="btn btn-primary" type="button">开通月卡 ¥19.9</button>
    <p>开通即表示同意<a href="#agreement">《会员服务协议》</a></p>
  </div>
</div>
</body>
</html>
