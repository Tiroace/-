<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>免费次数用完</title>
<meta name="viewport" content="width=390">
<link rel="stylesheet" href="theme.css">
</head>
<body>
<div class="page" style="width: 390px; height: 844px">
  <div class="main" aria-hidden="true">
    <div class="brand"><div class="logo"><i></i><i></i></div><b>面试请等等</b></div>
    <p class="hero-title">去面试之前，<br>先让我看一眼</p>
    <div class="card upload" style="height: 300px; box-sizing: border-box"></div>
  </div>
  <div class="dim-layer" aria-hidden="true"></div>

  <section class="sheet" role="dialog" aria-label="免费次数用完了">
    <div class="handle" aria-hidden="true"></div>
    <h2>免费次数用完了</h2>
    <p class="lead">选一种方式，继续检查。</p>

    <div class="opt">
      <span class="icon-44" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5z" fill="currentColor"/></svg></span>
      <span class="grow"><span class="t">看一段广告，再查 1 次</span><span class="s">看完就到账，今天还能看 5 次</span></span>
      <button class="btn btn-small" type="button">看广告</button>
    </div>

    <div class="vip">
      <div class="head">
        <span class="icon-44 gold" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6l-5.4 2.9 1.2-6-4.5-4.2 6.1-.7z"/></svg></span>
        <span class="grow"><span class="t">开通会员，找工作期间放心查</span><span class="s">每天最多查 20 次，周卡 ¥6.9 起</span></span>
      </div>
      <a class="btn btn-primary" href="04-会员页.html">看看会员</a>
    </div>

    <p class="note">会员是一次性购买，不会自动续费。</p>
  </section>
</div>

</html>
