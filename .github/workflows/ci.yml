name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # 每天 01:00 UTC（北京时间 09:00）跑一次全量
    - cron: "0 1 * * *"

jobs:
  fast:
    name: 快速冒烟（<1 分钟）
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装轻量依赖
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn httpx python-multipart pytest opencc-python-reimplemented jieba
      - name: 快速冒烟
        run: python -m pytest -m smoke -q
      - name: 密钥扫描（二次防线）
        run: |
          if git grep -nE 'sk-[A-Za-z0-9]{16,}|ghp_[A-Za-z0-9]{20,}' -- . ':!*.example'; then
            echo "发现疑似密钥，构建失败"; exit 1
          fi

  full:
    name: 全量测试（每天一次）
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装全部依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 全量测试
        env:
          QBL_FEATURE_COMMUNITY: "0"
        run: python -m pytest -q
      - name: 引擎评测门槛
        run: python -m engine.evaluate
