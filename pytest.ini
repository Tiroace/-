[pytest]
# 测试入口说明（路线调整令第九节）
#
# 两个入口：
#   快跑冒烟（<1 分钟，每次提交跑）：
#       python -m pytest -m smoke
#   全量（每天一次 / 合并前跑）：
#       python -m pytest
#
# 标记约定：
#   smoke    核心契约与高危防线：报告 v2 结构、证据可追溯、等级校准、
#            额度三段式、社区开关与投票、合规禁用词
#   非 smoke 的用例 = 全量才跑（对抗性、构建产物、合规全量、社区全流程等）

testpaths = tests

markers =
    smoke: 快跑冒烟用例（<1 分钟），每次提交必跑

# 提速：跳过不需要的缓存
addopts = -p no:cacheprovider
